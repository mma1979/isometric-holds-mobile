<!DOCTYPE html>
<html>
<head>
<style>
  body { display: flex; gap: 10px; flex-wrap: wrap; background: #222; }
  .box {
    background-image: url('https://img.youtube.com/vi/a_O4N0z-Q_E/maxresdefault.jpg'); 
    background-size: 350%;
    background-repeat: no-repeat;
    border: 2px solid red;
    width: 320px; 
    height: 180px;
  }
</style>
</head>
<body>
  <div class="box" style="background-position: 13% 30%;"></div>
  <div class="box" style="background-position: 61% 30%;"></div>
  <div class="box" style="background-position: 100% 30%;"></div>
  <div class="box" style="background-position: 3% 83%;"></div>
  <div class="box" style="background-position: 58% 83%;"></div>
  <div class="box" style="background-position: 100% 83%;"></div>
</body>
</html>
